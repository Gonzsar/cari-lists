<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Mi Mundito ♡</title>
<meta name="theme-color" content="#f291ad"/>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    font-family:'Quicksand',sans-serif;
    background:#ffd9ec;
    touch-action:none;
  }
  #game-canvas{display:block;width:100%;height:100%;}

  /* ===== Pantalla de carga ===== */
  #loading{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(135deg,#ffeef4,#fde4c9);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    transition:opacity .6s ease;
  }
  #loading.hide{opacity:0;pointer-events:none;}
  #loading .heart{font-size:3.4rem;animation:beat 1.2s ease infinite;}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  #loading h1{
    font-family:'Dancing Script',cursive;color:#c84068;font-size:2.6rem;font-weight:700;
  }
  #loading p{color:#8a6878;font-size:.95rem;}

  /* ===== HUD ===== */
  .hud-btn{
    position:fixed;z-index:20;
    background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    border:2px solid #f7b3c6;border-radius:50px;
    color:#c84068;font-family:inherit;font-weight:700;font-size:.85rem;
    padding:9px 16px;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;
    box-shadow:0 6px 18px rgba(232,106,145,.3);
    transition:transform .2s ease;
  }
  .hud-btn:hover{transform:translateY(-2px);}
  #backBtn{top:14px;left:14px;}
  #helpBtn{top:14px;right:14px;}

  #worldTitle{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:19;
    font-family:'Dancing Script',cursive;font-size:1.7rem;font-weight:700;color:#c84068;
    text-shadow:0 2px 8px rgba(255,255,255,.8);
    pointer-events:none;white-space:nowrap;
  }

  /* Panel de controles */
  #helpPanel{
    position:fixed;top:64px;right:14px;z-index:21;
    background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border:2px solid #f7b3c6;border-radius:18px;
    padding:16px 18px;max-width:250px;
    box-shadow:0 10px 30px rgba(232,106,145,.3);
    color:#5a3a48;font-size:.86rem;line-height:1.9;
    display:none;
  }
  #helpPanel.show{display:block;}
  #helpPanel h3{
    font-family:'Dancing Script',cursive;color:#c84068;font-size:1.4rem;margin-bottom:6px;
  }
  #helpPanel b{color:#e96a91;}

  /* ===== Controles táctiles ===== */
  #joystick{
    position:fixed;bottom:26px;left:26px;z-index:22;
    width:110px;height:110px;border-radius:50%;
    background:rgba(255,255,255,.35);border:2px solid rgba(247,179,198,.8);
    display:none;
  }
  #joyKnob{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:46px;height:46px;border-radius:50%;
    background:rgba(233,106,145,.85);
    box-shadow:0 3px 10px rgba(200,64,104,.4);
  }
  #jumpBtn{
    position:fixed;bottom:40px;right:28px;z-index:22;
    width:74px;height:74px;border-radius:50%;
    background:rgba(233,106,145,.85);border:2px solid #fff;
    color:#fff;font-size:1.6rem;font-family:inherit;
    box-shadow:0 6px 18px rgba(200,64,104,.4);
    display:none;align-items:center;justify-content:center;
  }
  body.touch #joystick{display:block;}
  body.touch #jumpBtn{display:flex;}

  /* Reloj del día */
  #clock{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:19;
    background:rgba(255,255,255,.7);backdrop-filter:blur(6px);
    border:1.5px solid #f7b3c6;border-radius:40px;
    padding:6px 16px;color:#c84068;font-weight:700;font-size:.85rem;
    pointer-events:none;
  }
  @media (max-width:600px){
    #worldTitle{font-size:1.3rem;top:60px;}
    #clock{display:none;}
  }

  /* ===== Editor de personaje ===== */
  #charBtn{top:64px;left:14px;position:fixed;}
  #charEditor{
    position:fixed;top:0;right:0;bottom:0;z-index:40;
    width:min(340px,94vw);
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-left:2px solid #f7b3c6;
    padding:18px 16px 26px;
    overflow-y:auto;
    transform:translateX(105%);
    transition:transform .35s cubic-bezier(.5,1.4,.4,1);
    font-size:.9rem;color:#5a3a48;
  }
  body.editing #charEditor{transform:translateX(0);}
  #charEditor h2{
    font-family:'Dancing Script',cursive;color:#c84068;
    font-size:1.9rem;text-align:center;margin-bottom:10px;
  }
  .ce-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;justify-content:center;}
  .ce-tab{
    border:1.5px solid #f7b3c6;background:#fff;border-radius:30px;
    padding:6px 12px;font-family:inherit;font-weight:700;font-size:.78rem;
    color:#c84068;cursor:pointer;
  }
  .ce-tab.active{background:#e96a91;color:#fff;border-color:#e96a91;}
  .ce-section{display:none;}
  .ce-section.active{display:block;}
  .ce-label{
    font-weight:700;color:#e96a91;font-size:.8rem;
    margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px;
  }
  .ce-swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .ce-sw{
    width:30px;height:30px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1.5px #fbd0dd;cursor:pointer;
  }
  .ce-sw.active{outline:2.5px solid #c84068;outline-offset:2px;}
  .ce-styles{display:flex;flex-wrap:wrap;gap:7px;}
  .ce-style{
    border:1.5px solid #fbd0dd;background:#fff;border-radius:14px;
    padding:8px 12px;font-family:inherit;font-weight:600;font-size:.8rem;
    color:#5a3a48;cursor:pointer;
  }
  .ce-style.active{background:#f7b3c6;border-color:#e96a91;color:#fff;}
  #ceSize{width:100%;accent-color:#e96a91;}
  .ce-actions{display:flex;gap:8px;margin-top:18px;}
  .ce-actions button{
    flex:1;border:none;border-radius:30px;padding:12px;
    font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;
  }
  #ceRandom{background:#fde4c9;color:#95560f;}
  #ceDone{
    background:linear-gradient(135deg,#f291ad,#e96a91);color:#fff;
    box-shadow:0 6px 16px rgba(232,106,145,.4);
  }
  body.editing #joystick, body.editing #jumpBtn, body.editing #helpBtn,
  body.editing #clock, body.editing #helpPanel, body.editing #charBtn,
  body.editing #backBtn, body.editing #worldTitle{display:none !important;}
  @media (max-width:640px){
    #charEditor{
      top:auto;left:0;right:0;width:100%;max-height:54vh;
      border-left:none;border-top:2px solid #f7b3c6;
      border-radius:22px 22px 0 0;
      transform:translateY(110%);
    }
    body.editing #charEditor{transform:translateY(0);}
  }
</style>
<script>
  /* nombre desde la web principal */
  window.PLAYER_NAME = (function(){
    try{
      const s = JSON.parse(localStorage.getItem('cariList_settings_v2')||'{}');
      return s.name || '';
    }catch(e){ return ''; }
  })();
</script>

</head>
<body>

<div id="loading">
  <div class="heart">🌸</div>
  <h1>Mi Mundito</h1>
  <p>preparando tu mundo rosa...</p>
</div>

<a id="backBtn" class="hud-btn" href="index.html">← Mi rinconcito</a>
<button id="charBtn" class="hud-btn">🎀 Personaje</button>
<button id="helpBtn" class="hud-btn">✨ Controles</button>

<!-- ===== Editor de personaje ===== -->
<div id="charEditor">
  <h2>Tu personaje ♡</h2>
  <div class="ce-tabs" id="ceTabs"></div>
  <div id="ceSections"></div>
  <div class="ce-actions">
    <button id="ceRandom">🎲 Sorpresa</button>

</div>
<div id="worldTitle"></div>

<div id="helpPanel">
  <h3>Cómo jugar</h3>
  <b>W A S D</b> o flechitas → moverte<br>

<div id="joystick"><div id="joyKnob"></div></div>
<button id="jumpBtn">↑</button>
<div id="clock">☀️ Día</div>

<canvas id="game-canvas"></canvas>

<script type="module">
import * as THREE from 'three';

/* ==========================================================
   MI MUNDITO · Fase 1 — mundo, personaje, día/noche
   Preparado para crecer: fases futuras usan window.WORLD
   ========================================================== */

const WORLD_RADIUS = 230;

/* ==========================================================
   FASE 2 · Personaje personalizable
   ========================================================== */
const CHAR_DEFAULT = {
  skin:'#ffe0cf', hair:'#6b4a3a', hairStyle:'coletas',
  eyes:'#3a2530', eyeStyle:'normal', mouthStyle:'sonrisa', blush:'1',
  outfit:'vestido', dress:'#f291ad', shoes:'#c84068',
  accessory:'nada', acc:'#ffd166', size:1
};
const PALETTES = {
  skin: ['#ffe0cf','#ffd0b8','#f2b894','#d99e6f','#b97a4e','#8e5a35','#5f3a22','#ffc9de'],
  hair: ['#6b4a3a','#2e2024','#0f0d0e','#e8c07d','#c05e2a','#f291ad','#c79bff','#8cc8f1','#ffffff','#d44a76'],
  eyes: ['#3a2530','#111827','#2f6f4f','#3b82c4','#8b5cf6','#e96a91','#c98a2c','#64748b'],
  dress:['#f291ad','#e96a91','#c79bff','#8cc8f1','#8fce8a','#ffd166','#ff9e7d','#ffffff','#3a2530','#d44a76'],
  shoes:['#c84068','#3a2530','#ffffff','#8b5cf6','#3b82c4','#d9a86c','#ff9e7d','#8fce8a'],
  acc:  ['#ffd166','#f291ad','#c79bff','#ff6b9d','#8cc8f1','#ffffff','#c84068','#3a2530']
};
const STYLE_OPTS = {
  hairStyle: [['coletas','Coletas'],['bob','Bob'],['largo','Largo suelto'],['rodetes','Rodetes'],['cola','Cola alta'],['corto','Cortito'],['trenzas','Trenzas']],
  eyeStyle:  [['normal','Normales'],['grandes','Grandotes'],['felices','Felices'],['estrellas','Estrellitas']],
  mouthStyle:[['sonrisa','Sonrisa'],['grande','Sonrisota'],['gatito','Gatito'],['neutral','Seria'],['owo','Sorpresa']],
  blush:     [['0','Sin cachetes'],['1','Suaves'],['2','Marcados']],
  outfit:    [['vestido','Vestidito'],['princesa','Princesa'],['falda','Falda y top'],['enterito','Enterito']],
  accessory: [['nada','Nada'],['mono','Moño'],['conejita','Orejas de conejita'],['gatito','Orejitas de gato'],['coronita','Coronita'],['flores','Corona de flores']]
};
let charCfg = (()=>{
  try{ return Object.assign({}, CHAR_DEFAULT, JSON.parse(localStorage.getItem('mundito_char_v1')||'{}')); }
  catch(e){ return {...CHAR_DEFAULT}; }
})();
function saveChar(){
  try{ localStorage.setItem('mundito_char_v1', JSON.stringify(charCfg)); }catch(e){}
}

/* ---------- renderer / escena ---------- */
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffd9ec, 45, 160);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 400);

/* ---------- luces ---------- */
const hemi = new THREE.HemisphereLight(0xfff2f8, 0xd8f0c8, .75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dd, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55;  sun.shadow.camera.bottom = -55;
sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0004;
scene.add(sun); scene.add(sun.target);

/* ---------- helpers ---------- */
const mat = (c, opts={}) => new THREE.MeshStandardMaterial({color:c, roughness:.9, metalness:0, ...opts});
function mesh(geo, m, x=0,y=0,z=0, shadow=true){
  const o = new THREE.Mesh(geo, m);
  o.position.set(x,y,z);
  o.castShadow = shadow; o.receiveShadow = shadow;
  return o;
}
const rand = (a,b)=>a+Math.random()*(b-a);

/* Obstáculos para colisión simple (círculos en el plano) */
const obstacles = [];   // {x, z, r}

/* ---------- suelo ---------- */
const ground = mesh(new THREE.CircleGeometry(WORLD_RADIUS+30, 64).rotateX(-Math.PI/2), mat(0xb9e3ae), 0,0,0);
ground.castShadow = false;
scene.add(ground);

/* caminito de tierra clara */
const path = mesh(new THREE.RingGeometry(14, 17, 48).rotateX(-Math.PI/2), mat(0xecd9b8), 0,.02,0, false);
path.receiveShadow = true;
scene.add(path);

/* ==========================================================
   NATURALEZA INSTANCIADA
   Todo el bosque se dibuja en ~14 draw calls (antes ~2000).
   ========================================================== */
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

function scatter(count, minD, maxD, sMin=.8, sMax=1.6){
  const pts = [];
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, d = rand(minD, maxD);
    pts.push({x:Math.cos(a)*d, z:Math.sin(a)*d, s:rand(sMin,sMax), rot:Math.random()*Math.PI*2});
  }
  return pts;
}

function fillInstanced(geo, material, placements, castShadow=false){
  const im = new THREE.InstancedMesh(geo, material, placements.length);
  placements.forEach((pl,i)=>{
    dummy.position.set(pl.x, pl.y||0, pl.z);
    dummy.rotation.set(0, pl.rot||0, 0);
    const s = pl.s ?? 1;
    dummy.scale.set(pl.sx ?? s, pl.sy ?? s, pl.sz ?? pl.sx ?? s);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
    if(pl.color) im.setColorAt(i, tmpColor.set(pl.color));
  });
  im.castShadow = castShadow;
  im.receiveShadow = true;
  if(im.instanceColor) im.instanceColor.needsUpdate = true;
  scene.add(im);
  return im;
}

/* --- dónde va cada cosa --- */
const sakuras = scatter(60, 22, WORLD_RADIUS-6);
const pinos   = scatter(50, 22, WORLD_RADIUS-6);
const flores  = scatter(220, 4, WORLD_RADIUS-4, 1, 1);
const hongos  = scatter(32, 15, WORLD_RADIUS-10, .7, 1.3);
const rocas   = scatter(26, 25, WORLD_RADIUS-8, .6, 1.5);

sakuras.forEach(p=>obstacles.push({x:p.x, z:p.z, r:1.1*p.s}));
pinos.forEach(p=>obstacles.push({x:p.x, z:p.z, r:.9*p.s}));
rocas.forEach(p=>obstacles.push({x:p.x, z:p.z, r:.9*p.s}));

/* --- troncos --- */
fillInstanced(
  new THREE.CylinderGeometry(.4,.55,3.4,7), mat(0x9a6b4f),
  sakuras.map(p=>({x:p.x, y:1.7*p.s, z:p.z, s:p.s, rot:p.rot})), true
);
fillInstanced(
  new THREE.CylinderGeometry(.3,.45,2,7), mat(0x9a6b4f),
  pinos.map(p=>({x:p.x, y:1*p.s, z:p.z, s:p.s, rot:p.rot})), true
);

/* --- copas de sakura (5 nubecitas por árbol, tonos variados) --- */
const foamOffsets = [[0,4.2,0,1.9],[1.2,3.6,.5,1.3],[-1.1,3.7,-.4,1.2],[.3,3.4,-1.1,1.1],[-.4,3.5,1.0,1.0]];
const foamPinks = [0xf9b9d4, 0xfcc8dd, 0xf5a8c8];
const foamPl = [];
sakuras.forEach(p=>{
  foamOffsets.forEach(([ox,oy,oz,r])=>{
    foamPl.push({x:p.x+ox*p.s, y:oy*p.s, z:p.z+oz*p.s, s:r*p.s,
                 color:foamPinks[Math.floor(Math.random()*foamPinks.length)]});
  });
});
fillInstanced(new THREE.IcosahedronGeometry(1,1), mat(0xffffff), foamPl, true);

/* --- copas de pino (3 conos por árbol) --- */
const coneLayers = [[1.8,2.6,3],[1.4,2.2,4.3],[1.0,1.8,5.4]];
const conePl = [];
pinos.forEach(p=>{
  coneLayers.forEach(([r,h,y])=>{
    conePl.push({x:p.x, y:y*p.s, z:p.z, sx:r*p.s, sy:h*p.s});
  });
});
fillInstanced(new THREE.ConeGeometry(1,1,8), mat(0x8fce8a), conePl, true);

/* --- flores: tallo + 5 pétalos + centro --- */
const flowerColors = [0xff8fb3, 0xffd166, 0xc79bff, 0xffffff, 0xff6b9d];
fillInstanced(
  new THREE.CylinderGeometry(.03,.03,.5,5), mat(0x7fbf72),
  flores.map(p=>({x:p.x, y:.25, z:p.z}))
);
const petalPl = [];
flores.forEach(p=>{
  const c = flowerColors[Math.floor(Math.random()*flowerColors.length)];
  for(let i=0;i<5;i++){
    const a = i/5*Math.PI*2;
    petalPl.push({x:p.x+Math.cos(a)*.12, y:.55, z:p.z+Math.sin(a)*.12, s:.09, color:c});
  }
});
fillInstanced(new THREE.SphereGeometry(1,6,6), mat(0xffffff), petalPl);
fillInstanced(
  new THREE.SphereGeometry(1,6,6), mat(0xffe08a),
  flores.map(p=>({x:p.x, y:.55, z:p.z, s:.07}))
);

/* --- honguitos --- */
fillInstanced(
  new THREE.CylinderGeometry(.16,.2,.5,7), mat(0xfff4ec),
  hongos.map(p=>({x:p.x, y:.25*p.s, z:p.z, s:p.s}))
);
fillInstanced(
  new THREE.SphereGeometry(.42,10,8,0,Math.PI*2,0,Math.PI/2), mat(0xf291ad),
  hongos.map(p=>({x:p.x, y:.5*p.s, z:p.z, s:p.s})), true
);

/* --- rocas --- */
fillInstanced(
  new THREE.IcosahedronGeometry(1,0), mat(0xcfc8d4),
  rocas.map(p=>({x:p.x, y:.4*p.s, z:p.z, s:p.s, sy:.6*p.s, rot:p.rot})), true
);

/* ---------- casita cottage ---------- */
function cottage(x,z,rotY=0){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(6,3.4,5), mat(0xfff4e6), 0,1.7,0));
  const roof = mesh(new THREE.ConeGeometry(4.9,2.8,4), mat(0xf291ad), 0,4.8,0);
  roof.rotation.y = Math.PI/4;
  g.add(roof);
  g.add(mesh(new THREE.BoxGeometry(.9,1.4,.9), mat(0xe8b4a0), 1.9,5.4,1.2));
  g.add(mesh(new THREE.BoxGeometry(1.3,2.1,.15), mat(0xb9825f), 0,1.05,2.53));
  g.add(mesh(new THREE.SphereGeometry(.08,6,6), mat(0xffe08a), .4,1.05,2.62, false));
  const win = mat(0xbfe8ff, {emissive:0x224466, emissiveIntensity:.15});
  g.add(mesh(new THREE.BoxGeometry(1.1,1.1,.12), win, -1.8,1.9,2.53));
  g.add(mesh(new THREE.BoxGeometry(1.1,1.1,.12), win, 1.8,1.9,2.53));
  g.add(mesh(new THREE.BoxGeometry(.12,1.1,1.1), win, 3.03,1.9,0));
  g.position.set(x,0,z);
  g.rotation.y = rotY;
  scene.add(g);
  obstacles.push({x,z,r:4.4});
  return g;
}

/* ---------- vallas ---------- */
function valla(x,z,rotY=0,len=4){
  const g = new THREE.Group();
  const wood = mat(0xd8a47c);
  const n = Math.round(len/1);
  for(let i=0;i<=n;i++){
    g.add(mesh(new THREE.CylinderGeometry(.09,.09,1.1,6), wood, -len/2+i*(len/n),.55,0));
  }
  g.add(mesh(new THREE.BoxGeometry(len,.12,.1), wood, 0,.75,0));
  g.add(mesh(new THREE.BoxGeometry(len,.12,.1), wood, 0,.4,0));
  g.position.set(x,0,z); g.rotation.y = rotY;
  scene.add(g);
}

/* ---------- casitas y vallas ---------- */
cottage(12, -8, -.5);
cottage(-18, 14, .9);
cottage(60, 45, 2.1);
cottage(-75, -50, .3);
cottage(110, -90, -1.2);
cottage(-140, 100, 1.7);
valla(12, -3.2, 0, 7);
valla(8.2, -6.5, Math.PI/2, 6);
valla(60, 50, .4, 8);
valla(-70, -45, -.6, 7);

/* ---------- nubes ---------- */
const cloudData = [];
for(let i=0;i<18;i++){
  const n = 3+Math.floor(Math.random()*3);
  const cl = {x:rand(-230,230), y:rand(32,52), z:rand(-230,230), speed:rand(.4,1.1), blobs:[]};
  for(let j=0;j<n;j++){
    cl.blobs.push({ox:j*2.1-n, oy:rand(-.3,.3), oz:rand(-.8,.8), r:rand(1.6,2.8)});
  }
  cloudData.push(cl);
}
const cloudCount = cloudData.reduce((a,c)=>a+c.blobs.length, 0);
const cloudIM = new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,8), mat(0xffffff,{roughness:1}), cloudCount);
cloudIM.frustumCulled = false;
scene.add(cloudIM);
function updateClouds(dt){
  let idx = 0;
  for(const c of cloudData){
    c.x += c.speed*dt;
    if(c.x > 250) c.x = -250;
    for(const b of c.blobs){
      dummy.position.set(c.x+b.ox, c.y+b.oy, c.z+b.oz);
      dummy.rotation.set(0,0,0);
      dummy.scale.setScalar(b.r);
      dummy.updateMatrix();
      cloudIM.setMatrixAt(idx++, dummy.matrix);
    }
  }
  cloudIM.instanceMatrix.needsUpdate = true;
}

/* ---------- pétalos cayendo ---------- */
const PETAL_N = 80;
const petalData = [];
for(let i=0;i<PETAL_N;i++){
  petalData.push({x:rand(-40,40), y:rand(2,22), z:rand(-40,40),
                  vy:rand(.5,1.1), ph:Math.random()*Math.PI*2, rx:0, ry:0});
}
const petalIM = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(.22,.22),
  new THREE.MeshBasicMaterial({color:0xffb3cd, side:THREE.DoubleSide, transparent:true, opacity:.85}),
  PETAL_N
);
petalIM.frustumCulled = false;
scene.add(petalIM);
function updatePetals(dt){
  for(let i=0;i<PETAL_N;i++){
    const p = petalData[i];
    p.y -= p.vy*dt;
    p.x += Math.sin(elapsed*1.5 + p.ph)*.35*dt;
    p.rx += dt*2; p.ry += dt*1.5;
    if(p.y < 0){
      p.x = P.pos.x+rand(-35,35);
      p.y = rand(14,24);
      p.z = P.pos.z+rand(-35,35);
    }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rx, p.ry, 0);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    petalIM.setMatrixAt(i, dummy.matrix);
  }
  petalIM.instanceMatrix.needsUpdate = true;
}

/* ---------- personaje (construido desde charCfg) ---------- */
function buildCharacter(cfg){
  const g = new THREE.Group();
  const skinM  = mat(cfg.skin);
  const hairM  = mat(cfg.hair);
  const dressM = mat(cfg.dress);
  const shoeM  = mat(cfg.shoes);
  const accM   = mat(cfg.acc);

  /* --- piecitos --- */
  const legL = mesh(new THREE.CapsuleGeometry(.1,.25,4,6), shoeM, -.18,.25,0);
  const legR = mesh(new THREE.CapsuleGeometry(.1,.25,4,6), shoeM, .18,.25,0);
  g.add(legL); g.add(legR);

  /* --- outfit --- */
  let dressRef = null;
  if(cfg.outfit === 'princesa'){
    dressRef = mesh(new THREE.ConeGeometry(.72,1.1,12), dressM, 0,.78,0);
    g.add(dressRef);
    g.add(mesh(new THREE.ConeGeometry(.5,.6,12), dressM, 0,1.05,0));
    g.add(mesh(new THREE.SphereGeometry(.32,10,10), dressM, 0,1.3,0));
    g.add(mesh(new THREE.TorusGeometry(.34,.035,6,14).rotateX(Math.PI/2), accM, 0,1.18,0, false));
  } else if(cfg.outfit === 'falda'){
    g.add(mesh(new THREE.SphereGeometry(.34,10,10), mat('#ffffff'), 0,1.28,0));
    dressRef = mesh(new THREE.ConeGeometry(.52,.5,10), dressM, 0,.78,0);
    g.add(dressRef);
    g.add(mesh(new THREE.CylinderGeometry(.22,.26,.45,8), skinM, 0,.55,0));
  } else if(cfg.outfit === 'enterito'){
    dressRef = mesh(new THREE.CapsuleGeometry(.34,.65,4,10), dressM, 0,1.0,0);
    g.add(dressRef);
  } else { /* vestido */
    dressRef = mesh(new THREE.ConeGeometry(.55,.95,10), dressM, 0,.85,0);
    g.add(dressRef);
    g.add(mesh(new THREE.SphereGeometry(.34,10,10), dressM, 0,1.28,0));
  }

  /* --- bracitos --- */
  const armL = mesh(new THREE.CapsuleGeometry(.09,.4,4,6), skinM, -.44,1.15,0);
  const armR = mesh(new THREE.CapsuleGeometry(.09,.4,4,6), skinM, .44,1.15,0);
  armL.rotation.z = .35; armR.rotation.z = -.35;
  g.add(armL); g.add(armR);

  /* --- cabeza --- */
  g.add(mesh(new THREE.SphereGeometry(.5,14,14), skinM, 0,1.95,0));

  /* --- pelo --- */
  const hs = cfg.hairStyle;
  if(hs === 'corto'){
    g.add(mesh(new THREE.SphereGeometry(.55,14,14,0,Math.PI*2,0,Math.PI/1.55), hairM, 0,2.02,0));
  } else {
    g.add(mesh(new THREE.SphereGeometry(.53,14,14,0,Math.PI*2,0,Math.PI/1.75), hairM, 0,2.02,0));
  }
  if(hs === 'coletas'){
    g.add(mesh(new THREE.SphereGeometry(.2,8,8), hairM, -.58,1.85,-.05));
    g.add(mesh(new THREE.SphereGeometry(.2,8,8), hairM, .58,1.85,-.05));
  } else if(hs === 'bob'){
    const s1 = mesh(new THREE.SphereGeometry(.3,10,10), hairM, -.42,1.75,-.05); s1.scale.set(.75,1.15,.85);
    const s2 = mesh(new THREE.SphereGeometry(.3,10,10), hairM, .42,1.75,-.05); s2.scale.set(.75,1.15,.85);
    g.add(s1); g.add(s2);
  } else if(hs === 'largo'){
    const back = mesh(new THREE.SphereGeometry(.42,12,12), hairM, 0,1.45,-.3);
    back.scale.set(1,1.7,.7);
    g.add(back);
  } else if(hs === 'rodetes'){
    g.add(mesh(new THREE.SphereGeometry(.22,8,8), hairM, -.35,2.45,-.05));
    g.add(mesh(new THREE.SphereGeometry(.22,8,8), hairM, .35,2.45,-.05));
  } else if(hs === 'cola'){
    g.add(mesh(new THREE.SphereGeometry(.2,8,8), hairM, 0,2.4,-.28));
    const tail = mesh(new THREE.CapsuleGeometry(.13,.55,4,8), hairM, 0,1.85,-.52);
    tail.rotation.x = .35;
    g.add(tail);
  } else if(hs === 'trenzas'){
    [-.52,.52].forEach(x=>{
      g.add(mesh(new THREE.SphereGeometry(.14,8,8), hairM, x,1.75,.02));
      g.add(mesh(new THREE.SphereGeometry(.12,8,8), hairM, x,1.52,.05));
      g.add(mesh(new THREE.SphereGeometry(.1,8,8),  hairM, x,1.32,.08));
    });
  }

  /* --- ojitos --- */
  const eyeM = mat(cfg.eyes);
  const ex=.17, ey=1.98, ez=.45;
  if(cfg.eyeStyle === 'felices'){
    [-ex,ex].forEach(x=>{
      g.add(mesh(new THREE.TorusGeometry(.07,.018,6,10,Math.PI), eyeM, x,ey-.02,ez, false));
    });
  } else if(cfg.eyeStyle === 'estrellas'){
    [-ex,ex].forEach(x=>{
      const st = mesh(new THREE.OctahedronGeometry(.08), eyeM, x,ey,ez, false);
      st.scale.z = .4;
      g.add(st);
    });
  } else {
    const r = cfg.eyeStyle === 'grandes' ? .085 : .06;
    [-ex,ex].forEach(x=>{
      g.add(mesh(new THREE.SphereGeometry(r,8,8), eyeM, x,ey,ez, false));
      g.add(mesh(new THREE.SphereGeometry(r*.3,6,6), mat('#ffffff'), x+.02,ey+.02,ez+r*.8, false));
    });
  }

  /* --- cachetitos --- */
  if(String(cfg.blush) !== '0'){
    const bm = new THREE.MeshBasicMaterial({color:0xff9db8, transparent:true, opacity: String(cfg.blush)==='2' ? .85 : .5});
    g.add(mesh(new THREE.SphereGeometry(.055,6,6), bm, -.3,1.86,.4, false));
    g.add(mesh(new THREE.SphereGeometry(.055,6,6), bm, .3,1.86,.4, false));
  }

  /* --- boquita --- */
  const mouthM = mat('#c84068');
  const my=1.82, mz=.46;
  if(cfg.mouthStyle === 'grande'){
    const m = mesh(new THREE.TorusGeometry(.13,.02,6,12,Math.PI), mouthM, 0,my+.06,mz, false);
    m.rotation.z = Math.PI;
    g.add(m);
  } else if(cfg.mouthStyle === 'gatito'){
    [-.05,.05].forEach(x=>{
      const m = mesh(new THREE.TorusGeometry(.05,.015,6,10,Math.PI), mouthM, x,my+.02,mz, false);
      m.rotation.z = Math.PI;
      g.add(m);
    });
  } else if(cfg.mouthStyle === 'owo'){
    g.add(mesh(new THREE.TorusGeometry(.045,.016,6,12), mouthM, 0,my,mz, false));
  } else if(cfg.mouthStyle === 'neutral'){
    g.add(mesh(new THREE.BoxGeometry(.14,.025,.02), mouthM, 0,my,mz, false));
  } else { /* sonrisa */
    const m = mesh(new THREE.TorusGeometry(.09,.016,6,12,Math.PI), mouthM, 0,my+.04,mz, false);
    m.rotation.z = Math.PI;
    g.add(m);
  }

  /* --- accesorio --- */
  const acc = cfg.accessory;
  if(acc === 'mono'){
    const bow = new THREE.Group();
    const l = mesh(new THREE.SphereGeometry(.13,8,8), accM, -.13,0,0); l.scale.set(1.2,.75,.6);
    const r = mesh(new THREE.SphereGeometry(.13,8,8), accM, .13,0,0);  r.scale.set(1.2,.75,.6);
    bow.add(l); bow.add(r);
    bow.add(mesh(new THREE.SphereGeometry(.07,8,8), accM, 0,0,0));
    bow.position.set(.34,2.42,.12);
    bow.rotation.z = -.3;
    g.add(bow);
  } else if(acc === 'conejita'){
    [-.22,.22].forEach((x,i)=>{
      const ear = mesh(new THREE.SphereGeometry(.16,8,10), mat('#ffffff'), x,2.8,0);
      ear.scale.set(.55,1.9,.45);
      ear.rotation.z = i===0 ? .16 : -.16;
      g.add(ear);
      const inner = mesh(new THREE.SphereGeometry(.09,6,8), mat('#ffd5e0'), x*1.02,2.82,.06, false);
      inner.scale.set(.45,1.5,.3);
      inner.rotation.z = i===0 ? .16 : -.16;
      g.add(inner);
    });
  } else if(acc === 'gatito'){
    [-.3,.3].forEach((x,i)=>{
      const ear = mesh(new THREE.ConeGeometry(.15,.3,6), hairM, x,2.52,0);
      ear.rotation.z = i===0 ? .25 : -.25;
      g.add(ear);
      g.add(mesh(new THREE.ConeGeometry(.08,.16,6), mat('#ffd5e0'), x*.98,2.5,.03, false));
    });
  } else if(acc === 'coronita'){
    g.add(mesh(new THREE.TorusGeometry(.3,.045,6,16).rotateX(Math.PI/2), accM, 0,2.52,0));
    for(let i=0;i<4;i++){
      const a = i/4*Math.PI*2;
      g.add(mesh(new THREE.SphereGeometry(.05,6,6), accM, Math.cos(a)*.3,2.62,Math.sin(a)*.3, false));
    }
  } else if(acc === 'flores'){
    for(let i=0;i<7;i++){
      const a = i/7*Math.PI*2;
      g.add(mesh(new THREE.SphereGeometry(.07,6,6), mat(flowerColors[i%flowerColors.length]), Math.cos(a)*.48,2.3,Math.sin(a)*.48, false));
    }
  }

  g.scale.setScalar(cfg.size || 1);
  g.userData = {armL, armR, legL, legR, dress: dressRef};
  return g;
}

let player = buildCharacter(charCfg);
scene.add(player);

function applyCharacter(){
  const old = player;
  const rotY = old ? old.rotation.y : 0;
  if(old){
    scene.remove(old);
    old.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material && o.material.dispose) o.material.dispose();
    });
  }
  player = buildCharacter(charCfg);
  player.rotation.y = rotY;
  player.position.copy(P.pos);
  scene.add(player);
  if(window.WORLD) window.WORLD.player = player;
  saveChar();
}

/* ---------- estado del jugador ---------- */
const P = {

/* ---------- cámara orbital ---------- */
const cam = { yaw: Math.PI, pitch: .35, dist: 9 };
let dragging = false, lastX=0, lastY=0;

canvas.addEventListener('pointerdown', e=>{
  if(e.pointerType==='touch') return;   /* touch se maneja aparte */
  dragging = true; lastX=e.clientX; lastY=e.clientY;
});
addEventListener('pointerup', ()=>dragging=false);
addEventListener('pointermove', e=>{
  if(!dragging || e.pointerType==='touch') return;
  cam.yaw   -= (e.clientX-lastX)*.005;
  cam.pitch += (e.clientY-lastY)*.004;
  cam.pitch = Math.max(.08, Math.min(1.25, cam.pitch));
  lastX=e.clientX; lastY=e.clientY;
});
addEventListener('wheel', e=>{
  cam.dist = Math.max(4, Math.min(18, cam.dist + e.deltaY*.01));
});

/* ---------- teclado ---------- */

addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
addEventListener('keyup',   e=>{ keys[e.code]=false; });

/* ---------- controles táctiles ---------- */
const isTouch = matchMedia('(pointer:coarse)').matches;
if(isTouch) document.body.classList.add('touch');

const joy = {active:false, id:null, cx:0, cy:0, dx:0, dy:0};
const joyEl = document.getElementById('joystick');
const knob = document.getElementById('joyKnob');
let camTouch = {id:null, x:0, y:0};

addEventListener('touchstart', e=>{
  for(const t of e.changedTouches){
    const r = joyEl.getBoundingClientRect();
    if(isTouch && t.clientX>=r.left-20 && t.clientX<=r.right+20 && t.clientY>=r.top-20 && t.clientY<=r.bottom+20){
      joy.active=true; joy.id=t.identifier;
      joy.cx=r.left+r.width/2; joy.cy=r.top+r.height/2;
    } else if(camTouch.id===null && t.target===canvas){
      camTouch.id=t.identifier; camTouch.x=t.clientX; camTouch.y=t.clientY;
    }
  }
},{passive:true});
addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(joy.active && t.identifier===joy.id){
      let dx=t.clientX-joy.cx, dy=t.clientY-joy.cy;
      const len=Math.hypot(dx,dy), max=44;
      if(len>max){ dx*=max/len; dy*=max/len; }
      joy.dx=dx/max; joy.dy=dy/max;
      knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    } else if(t.identifier===camTouch.id){
      cam.yaw   -= (t.clientX-camTouch.x)*.006;
      cam.pitch += (t.clientY-camTouch.y)*.005;
      cam.pitch = Math.max(.08, Math.min(1.25, cam.pitch));
      camTouch.x=t.clientX; camTouch.y=t.clientY;
    }
  }
},{passive:true});
addEventListener('touchend', e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){
      joy.active=false; joy.id=null; joy.dx=0; joy.dy=0;
      knob.style.transform='translate(-50%,-50%)';
    }
    if(t.identifier===camTouch.id) camTouch.id=null;
  }
});
document.getElementById('jumpBtn').addEventListener('touchstart', e=>{
  e.preventDefault();
  if(!editorMode && P.onGround){ P.vy = 10; P.onGround=false; }
});

/* ---------- ciclo día / noche ---------- */
const DAY_LENGTH = 300;  /* segundos por ciclo completo */
const skyKeys = [
  {t:0.00, sky:0xffe3f0, fog:0xffd9ec, sun:0xfff0dd, i:1.6, hemi:.75, label:'☀️ Día'},
  {t:0.40, sky:0xffe3f0, fog:0xffd9ec, sun:0xfff0dd, i:1.6, hemi:.75, label:'☀️ Día'},
  {t:0.50, sky:0xffb37d, fog:0xffc19a, sun:0xff9d5c, i:1.1, hemi:.5,  label:'🌇 Atardecer'},
  {t:0.60, sky:0x241b3d, fog:0x2c2148, sun:0x8fa8ff, i:.25, hemi:.22, label:'🌙 Noche'},
  {t:0.85, sky:0x241b3d, fog:0x2c2148, sun:0x8fa8ff, i:.25, hemi:.22, label:'🌙 Noche'},
  {t:0.93, sky:0xffc9a3, fog:0xffd4b3, sun:0xffc07a, i:1.0, hemi:.5,  label:'🌅 Amanecer'},
  {t:1.00, sky:0xffe3f0, fog:0xffd9ec, sun:0xfff0dd, i:1.6, hemi:.75, label:'☀️ Día'}
];
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function lerpSky(t){
  let a=skyKeys[0], b=skyKeys[skyKeys.length-1];
  for(let i=0;i<skyKeys.length-1;i++){
    if(t>=skyKeys[i].t && t<=skyKeys[i+1].t){ a=skyKeys[i]; b=skyKeys[i+1]; break; }
  }
  const f = (t-a.t)/Math.max(.0001,(b.t-a.t));
  scene.background = _c1.set(a.sky).lerp(_c2.set(b.sky), f).clone();
  scene.fog.color.set(_c1.set(a.fog).lerp(_c2.set(b.fog), f));
  sun.color.set(_c1.set(a.sun).lerp(_c2.set(b.sun), f));
  sun.intensity = a.i+(b.i-a.i)*f;
  hemi.intensity = a.hemi+(b.hemi-a.hemi)*f;
  return f<.5 ? a.label : b.label;
}

/* ---------- loop principal ---------- */
const clockEl = document.getElementById('clock');
const clock3 = new THREE.Clock();
let elapsed = 0;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock3.getDelta(), .05);
  elapsed += dt;

  /* --- ciclo del cielo --- */
  const dayT = (elapsed % DAY_LENGTH)/DAY_LENGTH;
  const label = lerpSky(dayT);
  if(clockEl.textContent !== label) clockEl.textContent = label;
  const sunA = dayT*Math.PI*2 - Math.PI/2;
  sun.position.set(
    P.pos.x + Math.cos(sunA)*60,
    Math.max(12, Math.sin(sunA)*80),
    P.pos.z + 40
  );
  sun.target.position.copy(P.pos);

  /* --- input de movimiento (bloqueado en el editor) --- */
  let ix=0, iz=0;
  if(!editorMode){
    if(keys['KeyW']||keys['ArrowUp'])    iz += 1;
    if(keys['KeyS']||keys['ArrowDown'])  iz -= 1;
    if(keys['KeyA']||keys['ArrowLeft'])  ix += 1;
    if(keys['KeyD']||keys['ArrowRight']) ix -= 1;
    if(joy.active){ ix -= joy.dx; iz -= joy.dy; }
  }

  const run = keys['ShiftLeft']||keys['ShiftRight'];
  const speed = run ? 11 : 6;
  const moving = Math.hypot(ix,iz) > .1;

  if(moving){
    const ang = Math.atan2(ix,iz) + cam.yaw + Math.PI;
    P.vel.x = Math.sin(ang)*speed;
    P.vel.z = Math.cos(ang)*speed;
    P.yaw = ang;
  } else {
    P.vel.x *= .8; P.vel.z *= .8;
  }

  if(!editorMode && keys['Space'] && P.onGround){ P.vy = 10; P.onGround=false; }

  /* --- física --- */
  P.vy -= 28*dt;
  P.pos.x += P.vel.x*dt;
  P.pos.z += P.vel.z*dt;
  P.pos.y += P.vy*dt;
  if(P.pos.y <= 0){ P.pos.y=0; P.vy=0; P.onGround=true; }

  /* borde del mundo */
  const dCenter = Math.hypot(P.pos.x, P.pos.z);
  if(dCenter > WORLD_RADIUS){
    P.pos.x *= WORLD_RADIUS/dCenter;
    P.pos.z *= WORLD_RADIUS/dCenter;
  }
  /* colisiones con obstáculos */
  for(const o of obstacles){
    const dx=P.pos.x-o.x, dz=P.pos.z-o.z;
    const d=Math.hypot(dx,dz), minD=o.r+.45;
    if(d < minD && d > .001){
      P.pos.x = o.x + dx/d*minD;
      P.pos.z = o.z + dz/d*minD;
    }
  }

  /* --- animación del personaje --- */
  player.position.copy(P.pos);
  if(editorMode){
    /* vitrina: gira despacito para verse de todos lados */
    player.rotation.y += dt*.6;
  } else {
    /* giro suave hacia la dirección de movimiento */
    let dy = P.yaw - player.rotation.y;
    while(dy>Math.PI) dy-=Math.PI*2;
    while(dy<-Math.PI) dy+=Math.PI*2;
    player.rotation.y += dy*Math.min(1, dt*12);
  }

  const u = player.userData;
  if(moving && P.onGround){
    P.walkT += dt*(run?13:9);
    const s = Math.sin(P.walkT);
    u.armL.rotation.x =  s*.7;  u.armR.rotation.x = -s*.7;
    u.legL.rotation.x = -s*.8;  u.legR.rotation.x =  s*.8;
    player.position.y = P.pos.y + Math.abs(Math.sin(P.walkT))*.08;
  } else {
    u.armL.rotation.x *= .8; u.armR.rotation.x *= .8;
    u.legL.rotation.x *= .8; u.legR.rotation.x *= .8;
    /* respiración idle */
    if(u.dress) u.dress.scale.setScalar(1 + Math.sin(elapsed*2)*.012);
  }

  /* --- cámara --- */
  if(editorMode){
    cam.dist  += (5   - cam.dist) *Math.min(1, dt*4);
    cam.pitch += (.18 - cam.pitch)*Math.min(1, dt*4);
  }
  const cx = P.pos.x + Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist;
  const cz = P.pos.z + Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist;
  const cy = P.pos.y + 1.6 + Math.sin(cam.pitch)*cam.dist;
  camera.position.lerp(new THREE.Vector3(cx,cy,cz), Math.min(1, dt*8));
  camera.lookAt(P.pos.x, P.pos.y+1.5, P.pos.z);

  /* --- nubes y pétalos (instanciados) --- */
  updateClouds(dt);
  updatePetals(dt);

  renderer.render(scene, camera);
}

  editorMode = false;
  cam.dist = prevCamDist;
  document.body.classList.remove('editing');
  saveChar();
}

function ceEl(tag, cls, text){
  const el = document.createElement(tag);
  if(cls) el.className = cls;
  if(text) el.textContent = text;
  return el;
}
function addSwatches(sec, label, key){
  sec.appendChild(ceEl('div','ce-label',label));
  const row = ceEl('div','ce-swatches');
  PALETTES[key].forEach(color=>{
    const b = ceEl('button','ce-sw');
    b.style.background = color;
    b.dataset.key = key; b.dataset.val = color;
    b.addEventListener('click', ()=>{
      charCfg[key] = color;
      applyCharacter();
      refreshEditorUI();
    });
    row.appendChild(b);
  });
  sec.appendChild(row);
}
function addStyles(sec, label, key){
  sec.appendChild(ceEl('div','ce-label',label));
  const row = ceEl('div','ce-styles');
  STYLE_OPTS[key].forEach(([val, name])=>{
    const b = ceEl('button','ce-style',name);
    b.dataset.key = key; b.dataset.val = val;
    b.addEventListener('click', ()=>{
      charCfg[key] = val;
      applyCharacter();
      refreshEditorUI();
    });
    row.appendChild(b);
  });
  sec.appendChild(row);
}
function addSize(sec){
  sec.appendChild(ceEl('div','ce-label','Altura'));
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = '.85'; inp.max = '1.2'; inp.step = '.01';
  inp.id = 'ceSize';
  inp.addEventListener('input', ()=>{
    charCfg.size = parseFloat(inp.value);
    player.scale.setScalar(charCfg.size);
    saveChar();
  });
  sec.appendChild(inp);
}

const TAB_DEFS = [
  {id:'piel',   label:'🖐️ Piel',   build(s){ addSwatches(s,'Tono de piel','skin'); addSize(s); }},
  {id:'pelo',   label:'💇‍♀️ Pelo',  build(s){ addStyles(s,'Peinado','hairStyle'); addSwatches(s,'Color de pelo','hair'); }},
  {id:'carita', label:'🌸 Carita', build(s){ addStyles(s,'Ojitos','eyeStyle'); addSwatches(s,'Color de ojos','eyes'); addStyles(s,'Boquita','mouthStyle'); addStyles(s,'Cachetitos','blush'); }},
  {id:'ropa',   label:'👗 Ropa',   build(s){ addStyles(s,'Outfit','outfit'); addSwatches(s,'Color principal','dress'); addSwatches(s,'Zapatitos','shoes'); }},
  {id:'extras', label:'🎀 Extras', build(s){ addStyles(s,'Accesorio','accessory'); addSwatches(s,'Color del accesorio','acc'); }}
];

function buildEditorUI(){
  const tabsEl = document.getElementById('ceTabs');
  const secsEl = document.getElementById('ceSections');
  TAB_DEFS.forEach((def, i)=>{
    const tab = ceEl('button','ce-tab'+(i===0?' active':''), def.label);
    tab.dataset.target = def.id;
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.ce-tab').forEach(t=>t.classList.toggle('active', t===tab));
      document.querySelectorAll('.ce-section').forEach(s=>s.classList.toggle('active', s.id==='ce-'+def.id));
    });
    tabsEl.appendChild(tab);
    const sec = ceEl('div','ce-section'+(i===0?' active':''));
    sec.id = 'ce-'+def.id;
    def.build(sec);
    secsEl.appendChild(sec);
  });
}

function refreshEditorUI(){
  document.querySelectorAll('.ce-sw').forEach(b=>{
    b.classList.toggle('active', charCfg[b.dataset.key] === b.dataset.val);
  });
  document.querySelectorAll('.ce-style').forEach(b=>{
    b.classList.toggle('active', String(charCfg[b.dataset.key]) === b.dataset.val);
  });
  const slider = document.getElementById('ceSize');
  if(slider) slider.value = charCfg.size || 1;
}

const pick = a => a[Math.floor(Math.random()*a.length)];
function randomizeChar(){
  charCfg.skin = pick(PALETTES.skin);
  charCfg.hair = pick(PALETTES.hair);
  charCfg.eyes = pick(PALETTES.eyes);
  charCfg.dress = pick(PALETTES.dress);
  charCfg.shoes = pick(PALETTES.shoes);
  charCfg.acc = pick(PALETTES.acc);
  charCfg.hairStyle = pick(STYLE_OPTS.hairStyle)[0];
  charCfg.eyeStyle = pick(STYLE_OPTS.eyeStyle)[0];
  charCfg.mouthStyle = pick(STYLE_OPTS.mouthStyle)[0];
  charCfg.blush = pick(STYLE_OPTS.blush)[0];
  charCfg.outfit = pick(STYLE_OPTS.outfit)[0];
  charCfg.accessory = pick(STYLE_OPTS.accessory)[0];
  charCfg.size = Math.round(rand(.9,1.1)*100)/100;
  applyCharacter();
  refreshEditorUI();
}

buildEditorUI();
document.getElementById('charBtn').addEventListener('click', openEditor);
document.getElementById('ceDone').addEventListener('click', closeEditor);
document.getElementById('ceRandom').addEventListener('click', randomizeChar);
const title = document.getElementById('worldTitle');
title.textContent = window.PLAYER_NAME ? `El mundito de ${window.PLAYER_NAME} ♡` : 'Mi Mundito ♡';

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* exponer para fases futuras (construcción, crafteo, etc.) */
window.WORLD = { scene, camera, renderer, P, obstacles, charCfg, get player(){ return player; } };

/* arrancar */
tick();
setTimeout(()=>document.getElementById('loading').classList.add('hide'), 700);
</script>
</body>
